name: Windows release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - tests/test_release_package.py
      - docs/release/**
      - release.json
  push:
    tags: ['v*-ko.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read the version and immutable build source
        id: metadata
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          @'
          import json, os, re
          from pathlib import Path
          config = json.loads(Path('release.json').read_text())
          version, commit = config['version'], config['source_commit']
          if not re.fullmatch(r'v\d+\.\d+\.\d+-ko\.\d+', version):
              raise SystemExit('Invalid Korean prerelease version')
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Build source must be an exact commit')
          if os.environ['RELEASE_REF_TYPE'] == 'tag' and os.environ['RELEASE_REF_NAME'] != version:
              raise SystemExit('Tag does not match release.json; update the manifest first')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nsource_commit={commit}\n')
          '@ | python -
      - name: Checkout the pinned Korean implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.metadata.outputs.source_commit }}
          path: build-source
          persist-credentials: false
      - name: Verify source revision
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ steps.metadata.outputs.source_commit }}
        run: |
          $actual = git -C build-source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_COMMIT) { throw 'Source revision mismatch' }
      - name: Install pinned build dependencies
        run: python -m pip install -r build-source/src/requirements-build.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Test release assembly
        run: python -m unittest discover -s tests -v
      - name: Test the Korean application (no system font installation)
        working-directory: build-source
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q scripts tests build-source/src build-source/tests
      - name: Build GUI and CLI executables
        working-directory: build-source
        shell: pwsh
        run: ./build.ps1
      - name: Check packaged CLI entry points
        working-directory: build-source/dist
        shell: pwsh
        run: |
          & ./SyrianSegoe-Korean-Build.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged builder failed' }
          & ./SyrianSegoe-Korean-Install.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged installer failed' }
      - name: Check the packaged GUI opens without applying fonts
        working-directory: build-source/dist
        shell: pwsh
        run: |
          $gui = Start-Process -FilePath (Resolve-Path ./SyrianSegoe.exe) -PassThru
          $ownedIds = @($gui.Id)
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              $gui.Refresh()
              if ($gui.HasExited) { throw "GUI exited before opening (code $($gui.ExitCode))" }
              # PyInstaller onefile uses a parent bootloader and a child GUI process.
              $children = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($gui.Id)"
              $ownedIds = @(@($gui.Id) + @($children.ProcessId) | Where-Object { $_ } | Select-Object -Unique)
              $window = Get-Process -Id $ownedIds -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -eq 'SyrianSegoe' }
              if ($window) {
                $ready = $true
                break
              }
            }
            if (-not $ready) { throw 'Packaged GUI did not open its main window' }
          } finally {
            Get-Process -Id $ownedIds -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - name: Assemble and verify downloads
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
        run: |
          python scripts/package_release.py build --dist build-source/dist --source build-source --output release --version $env:RELEASE_VERSION --source-commit $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Release assembly failed' }
          python scripts/package_release.py verify release
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
      - name: Save reviewable downloads and release notes
        uses: actions/upload-artifact@v4
        with:
          name: SyrianSegoe-Korean-${{ steps.metadata.outputs.version }}-Windows-x64
          path: |
            release/SyrianSegoe-Korean.exe
            release/SyrianSegoe-Korean-Windows-x64.zip
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the verified prerelease
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'kbm323/SyrianSegoe'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SyrianSegoe-Korean-${{ needs.build.outputs.version }}-Windows-x64
          path: release
      - name: Verify downloads and create draft without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/package_release.py verify release
          gh release create "$RELEASE_VERSION" \
            --verify-tag --draft --prerelease \
            --title "SyrianSegoe Korean $RELEASE_VERSION · Windows 11 × Pretendard" \
            --notes-file release/RELEASE_NOTES.md
          gh release upload "$RELEASE_VERSION" \
            release/SyrianSegoe-Korean.exe \
            release/SyrianSegoe-Korean-Windows-x64.zip \
            release/SHA256SUMS.txt
          gh release download "$RELEASE_VERSION" --dir uploaded \
            --pattern SyrianSegoe-Korean.exe \
            --pattern SyrianSegoe-Korean-Windows-x64.zip \
            --pattern SHA256SUMS.txt
          python3 scripts/package_release.py verify uploaded
          gh release edit "$RELEASE_VERSION" --draft=false --prerelease
